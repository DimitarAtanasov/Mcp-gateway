connectors:
  - name: fhir
    enabled: true
    # HAPI or any FHIR R4/R4B/R5 server. https is required unless it is localhost.
    endpoint: "https://<your-fhir-server>/fhir"
    tools:
      - search_documents
      - get_document

authz:
  # Map each caller's AAD app id (or service principal object id) to the tools it may invoke.
  # Fail-closed: identities not listed here get zero tools.
  #
  # Note: authorization is per tool, not per patient. Any caller allowed search_documents can
  # search every indexed document. There is no row-level PHI scoping in this gateway.
  - identity: "00000000-0000-0000-0000-000000000000"  # Azure AI Foundry agent's app id
    allowed_tools:
      - search_documents
      - get_document
